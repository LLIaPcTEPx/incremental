name: build
on:
  push:
    paths-ignore:
      - 'ci-build-log.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        id: gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain > /tmp/build.log 2>&1 || true
          tail -n 400 /tmp/build.log > ci-build-log.txt
          cp /tmp/build.log /tmp/full.log
          ./gradlew --version >/dev/null 2>&1 || true
          grep -q "BUILD SUCCESSFUL" /tmp/build.log
      - name: publish log
        if: always()
        run: |
          git config user.email "ci@incremental"
          git config user.name "incremental-ci"
          git add -f ci-build-log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push || true
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: incremental
          path: build/libs/
