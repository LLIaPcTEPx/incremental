name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain > build.log 2>&1 && echo BUILD_OK || {
            echo "--- build failed, errors ---"
            grep -n -m 40 -E "error:|FAILURE:|What went wrong|Caused by:|Could not|e: " build.log | head -60
            echo "--- tail ---"
            tail -n 100 build.log
            exit 1
          }
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: incremental
          path: build/libs/
