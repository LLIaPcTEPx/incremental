name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            { echo "### build errors"; grep -n -m 30 -E "error:|What went wrong|Caused by:" /tmp/build.log | head -40; echo; echo "### tail"; tail -n 25 /tmp/build.log; } | tee error-summary.txt
            exit 1
          fi
      - name: report errors
        if: failure()
        run: |
          {
            echo "## build failed"
            echo '```'
            cat error-summary.txt 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: incremental
          path: build/libs/
