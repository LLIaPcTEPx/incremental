name: build
on:
  push:
    paths-ignore:
      - 'ci-build-log.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        id: gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain > /tmp/build.log 2>&1 || true
          tail -n 400 /tmp/build.log > ci-build-log.txt
          grep -q "BUILD SUCCESSFUL" /tmp/build.log
      - name: publish log and jar
        if: always()
        run: |
          git config user.email "ci@incremental"
          git config user.name "incremental-ci"
          git add -f ci-build-log.txt
          if [ -d build/libs ]; then
            mkdir -p dist
            rm -f dist/*.jar
            for f in build/libs/*.jar; do
              case "$f" in *-sources.jar|*-dev.jar) continue;; esac
              cp "$f" dist/incremental.jar
            done
            git add -f dist/incremental.jar 2>/dev/null || true
          fi
          git commit -m "ci: build log and jar [skip ci]" || true
          git push || true
      - name: capture build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: incremental
          path: build/libs/*.jar
      - name: publish jar to the latest build release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=build-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Latest build" --notes "Automatically built mod jar. Download the file named incremental-*.jar"
          for f in build/libs/incremental-*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) continue;; esac
            gh release upload "$TAG" "$f" --clobber
          done
